<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RAW GAME — Jailbreak</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    background: radial-gradient(circle at center, #111 0%, #000 100%);
    color: #c8ced8;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.08), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.08), transparent 40%);
    animation: bgPulse 6s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes bgPulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }

  /* ---------- Gato flotando ---------- */
  #cat-bg {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -90%);
    width: 150px; height: 150px;
    object-fit: contain;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.5));
    animation: float 3s ease-in-out infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes float {
    0%, 100% { transform: translate(-50%, -90%); }
    50%      { transform: translate(-50%, -96%); }
  }
  body.done #cat-bg,
  body.fail #cat-bg,
  body.log  #cat-bg { display: none; }

  /* ---------- Barra de carga en bucle ---------- */
  #loader {
    position: fixed;
    top: calc(50% + 30px);
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    max-width: 80vw;
    height: 8px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    overflow: hidden;
    z-index: 2;
    box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
  }
  #loader::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, transparent, #00d4ff, #a855f7, transparent);
    border-radius: 999px;
    animation: loading 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.6));
  }
  @keyframes loading {
    0%   { left: -40%; }
    100% { left: 100%; }
  }

  /* Texto bajo la barra */
  #status-text {
    position: fixed;
    top: calc(50% + 55px);
    left: 0; right: 0;
    text-align: center;
    font-size: 13px;
    letter-spacing: 3px;
    color: #5c6672;
    text-transform: uppercase;
    z-index: 2;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }

  /* ---------- Mensaje final (done / fail) ---------- */
  #msg {
    position: fixed;
    top: calc(50% + 40px);
    left: 0; right: 0;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1.5px;
    display: none;
    z-index: 2;
    animation: pop 0.5s ease-out;
  }
  @keyframes pop {
    0%   { transform: scale(0.8); opacity: 0; }
    70%  { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }

  body.done #loader,
  body.fail #loader,
  body.done #status-text,
  body.fail #status-text { display: none; }

  body.fail #msg {
    display: block;
    color: #d08a7f;
  }
  body.done #msg {
    display: block;
    color: #4ade80;
    font-weight: 700;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
  }
  body.done #msg::before { content: '✅  '; font-size: 22px; }
  body.fail #msg::before { content: '❌  '; font-size: 22px; }

  /* ---------- Vista de log (?log=1) ---------- */
  #wrap { padding: 0; position: relative; z-index: 2; }
  #state, #out { display: none; }

  body.log #loader,
  body.log #status-text,
  body.log #msg { display: none; }

  body.log #wrap { padding: 14px 18px; }

  body.log #state {
    display: block;
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 10px;
    color: #00d4ff;
    letter-spacing: 0.5px;
    text-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
  }
  body.log #out {
    display: block;
    white-space: pre-wrap;
    font: 12px/1.5 Consolas, "Courier New", monospace;
    background: #11151b;
    border: 1px solid #1e2732;
    border-radius: 8px;
    padding: 12px 14px;
    height: calc(100vh - 60px);
    overflow-y: auto;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
  }

  .ok     { color: #7fd0a0; }
  .bad    { color: #d08a7f; }
  .warn   { color: #d8c07f; }
  .safe   { color: #7fd0a0; }
  .danger { color: #d08a7f; }
  code    { color: #9fb3d0; }

  body.log #out::-webkit-scrollbar { width: 8px; }
  body.log #out::-webkit-scrollbar-track { background: #0b0d10; }
  body.log #out::-webkit-scrollbar-thumb {
    background: #1e2732;
    border-radius: 4px;
  }
  body.log #out::-webkit-scrollbar-thumb:hover { background: #2a3a4a; }
</style>
</head>
<body>

  <img id="cat-bg" src="cat.png" alt="" />

  <div id="loader"></div>
  <div id="status-text">Detecting firmware...</div>
  <div id="msg">Restart your console</div>

  <div id="wrap">
    <div id="state"></div>
    <div id="out"></div>
  </div>

  <script type="module">
    import "./jb.js?v=19";
  </script>

</body>
</html>
